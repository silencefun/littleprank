<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fake Windows Update — littleprank showcase</title>
<style>
  :root {
    --bg-card: #1b1b1f;
    --bg-secondary: #2a2a30;
    --border-color: #3a3a42;
    --text-muted: #9aa0a6;
    --text-primary: #e8eaed;
    --radius: 12px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #0f0f12;
    color: var(--text-primary);
    padding: 1.5rem;
  }
  .fake-update-container { max-width: 720px; margin: 0 auto; }

  .update-controls {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    padding: 1rem;
    margin-bottom: 1rem;
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
    align-items: flex-end;
  }
  .control-group { display: flex; flex-direction: column; gap: 0.25rem; }
  .control-group label { font-size: 0.75rem; color: var(--text-muted); }
  .control-group select {
    background: var(--bg-secondary);
    color: var(--text-primary);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-sm);
    padding: 0.35rem 0.6rem;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .btn-primary, .btn-secondary {
    border: none; border-radius: var(--radius-sm);
    padding: 0.5rem 1rem; font-size: 0.85rem; cursor: pointer; white-space: nowrap;
  }
  .btn-primary { background: #0078d4; color: #fff; }
  .btn-secondary { background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border-color); }

  .update-screen {
    background: #0078d4;
    min-height: 400px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 1.5rem; border-radius: var(--radius);
    position: relative; color: #fff; padding: 2rem;
  }
  .update-screen:fullscreen { border-radius: 0; min-height: 100vh; }
  .update-spinner { position: relative; width: 60px; height: 60px; }
  .spinner-ring {
    width: 100%; height: 100%;
    border: 4px solid rgba(255,255,255,0.2);
    border-top-color: #fff; border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  .spinner-dot {
    position: absolute; top: 50%; left: 50%;
    width: 8px; height: 8px; background: #fff; border-radius: 50%;
    transform: translate(-50%,-50%);
    animation: pulse-dot 1.5s ease-in-out infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse-dot {
    0%,100% { opacity: 0.4; transform: translate(-50%,-50%) scale(1); }
    50% { opacity: 1; transform: translate(-50%,-50%) scale(1.3); }
  }
  .update-text { font-size: 1.5rem; font-weight: 300; }
  .update-percent { font-size: 2.5rem; font-weight: 200; font-variant-numeric: tabular-nums; }
  .update-subtext { font-size: 0.9rem; opacity: 0.8; }
  .win-logo { position: absolute; bottom: 2rem; opacity: 0.9; }
  .update-screen.win10 { background: #1f1f1f; }

  @media (max-width: 768px) {
    .update-controls { flex-direction: column; align-items: stretch; }
    .update-text { font-size: 1.2rem; }
    .update-percent { font-size: 2rem; }
  }
</style>
</head>
<body>
<div class="fake-update-container">
  <div class="update-controls" id="update-controls">
    <div class="control-group">
      <label>Windows version</label>
      <select id="update-version">
        <option value="win11">Windows 11</option>
        <option value="win10">Windows 10</option>
      </select>
    </div>
    <div class="control-group">
      <label>Stage</label>
      <select id="update-stage">
        <option value="downloading">Downloading</option>
        <option value="installing">Installing</option>
        <option value="configuring" selected>Configuring</option>
      </select>
    </div>
    <div class="control-group">
      <label>Speed</label>
      <select id="update-speed">
        <option value="slow">Slow</option>
        <option value="normal" selected>Normal</option>
        <option value="fast">Fast</option>
      </select>
    </div>
    <button class="btn-primary" id="start-update">Start</button>
    <button class="btn-secondary" id="fullscreen-btn">Fullscreen</button>
  </div>

  <div class="update-screen win11" id="update-screen">
    <div class="update-spinner">
      <div class="spinner-ring"></div>
      <div class="spinner-dot"></div>
    </div>
    <div class="update-text" id="update-text">Configuring update</div>
    <div class="update-percent" id="update-percent">0%</div>
    <div class="update-subtext" id="update-subtext">Do not turn off your computer</div>
    <div class="win-logo">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor">
        <path d="M0 3.449L9.75 2.1v9.451H0m10.949-9.602L24 0v11.4H10.949M0 12.6h9.75v9.451L0 20.699M10.949 12.6H24V24l-12.9-1.801"/>
      </svg>
    </div>
  </div>
</div>

<script>
  let updateInterval = null;
  let currentProgress = 0;
  const texts = {
    downloading: 'Downloading updates',
    installing: 'Installing updates',
    configuring: 'Configuring update',
    subtext: 'Do not turn off your computer',
    complete: 'Update complete, restarting...'
  };
  function startUpdate() {
    const version = document.getElementById('update-version').value;
    const stage = document.getElementById('update-stage').value;
    const speed = document.getElementById('update-speed').value;
    const screen = document.getElementById('update-screen');
    const textEl = document.getElementById('update-text');
    const percentEl = document.getElementById('update-percent');
    const subtextEl = document.getElementById('update-subtext');
    screen.className = 'update-screen ' + version;
    const t = texts;
    textEl.textContent = t[stage] || t.configuring;
    subtextEl.textContent = t.subtext;
    const speedMap = { slow: 200, normal: 80, fast: 30 };
    const interval = speedMap[speed] || 80;
    if (updateInterval) clearInterval(updateInterval);
    currentProgress = 0;
    updateInterval = setInterval(() => {
      if (currentProgress < 97) {
        currentProgress += Math.random() * 3 + 0.5;
        if (currentProgress > 97) currentProgress = 97;
        percentEl.textContent = Math.floor(currentProgress) + '%';
      } else {
        if (Math.random() > 0.95) {
          currentProgress = 100;
          percentEl.textContent = '100%';
          textEl.textContent = t.complete;
          clearInterval(updateInterval);
          setTimeout(() => {
            currentProgress = 0;
            percentEl.textContent = '0%';
            textEl.textContent = t[stage] || t.configuring;
          }, 3000);
        }
      }
    }, interval);
  }
  function toggleFullscreen() {
    const screen = document.getElementById('update-screen');
    if (!document.fullscreenElement) {
      screen.requestFullscreen && screen.requestFullscreen().catch(function(){});
    } else {
      document.exitFullscreen();
    }
  }
  document.getElementById('start-update').addEventListener('click', startUpdate);
  document.getElementById('fullscreen-btn').addEventListener('click', toggleFullscreen);
  document.addEventListener('fullscreenchange', function() {
    var btn = document.getElementById('fullscreen-btn');
    if (btn) btn.textContent = document.fullscreenElement ? 'Exit Fullscreen' : 'Fullscreen';
  });
</script>
</body>
</html>
